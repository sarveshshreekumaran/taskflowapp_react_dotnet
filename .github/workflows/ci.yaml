name: TaskFlow CI/CD Pipeline

on:
  push: 
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: taskflow-frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: taskflow-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Typecheck and Build Frontend
        run: npm run build

  build-backend:
    name: Build Backend (.NET)
    runs-on: ubuntu-latest
    defaults: 
      run: 
        working-directory: TaskFlow.API

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with: 
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore

    - name: Build Backend
      run: dotnet build --no-restore --configuration Release       




